[project]
name = "langchain-demo-fin"
version = "0.1.0"
description = "Beginner-friendly demo of LangChain, LangGraph and LangSmith on AWS Bedrock"
readme = "README.md"
authors = [
    { name = "Pat Ghosh", email = "pathikritghosh93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.8",
    "langchain-aws>=1.9.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langsmith>=0.14.17",
    "python-dotenv>=1.2.4",
]

# This repo is a set of runnable examples, not a library, so uv does not need
# to build and install it as a package. `uv run main.py` is all you need.
[tool.uv]
package = false
